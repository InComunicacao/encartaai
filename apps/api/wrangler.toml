name = "encartaai-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# O id real é preenchido quando o banco for criado na conta
# (wrangler d1 create encartaai). Para testes e dev local, qualquer id serve.
[[d1_databases]]
binding = "DB"
database_name = "encartaai"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# SETUP_TOKEN é secret: wrangler secret put SETUP_TOKEN

# Imagens, logos, temas, fontes e exportações. Chaves:
#   tenants/<tenant_id>/<tipo>/<id>.<ext>   — do cliente
#   global/<tipo>/<id>.<ext>                — banco curado pelo super admin
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "encartaai-arquivos"

# As telas (apps/web) são servidas pelo mesmo Worker: mesma origem, cookie
# simples, sem CORS. /api/* vai para o código; o resto, para os arquivos,
# com qualquer rota desconhecida caindo no index.html (o React resolve).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
